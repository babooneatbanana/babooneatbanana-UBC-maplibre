<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>My map</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<style> body { margin: 0; } #map { position: absolute; inset: 0; } </style>
</head>
<body>
<div id="map"></div>
<script>
const map = new maplibregl.Map({
container: 'map',
style: 'https://tiles.openfreemap.org/styles/liberty',        // the file you downloaded from Maputnik
center: [-123.25, 49.26],    // longitude, latitude
zoom: 12
});
const url = 'https://babooneatbanana.github.io/babooneatbanana-UBC-maplibre/ubcv_poi.geojson'
map.on('load', function () {
map.addSource('POI', {
    type: 'geojson',
    data: url,
    attribution: 'Places of interest'
  });
map.addLayer({
    id: 'SERVICE_TYPE',
    type: 'circle',
    source: 'POI',
    paint: POImarker
  });
});
const POImarker = {
'circle-radius': 4,
'circle-color': ['match', ['get', 'SERVICE_TYPE'],
    'child_care', '#0000ff', '#999999'],
}
map.addControl(new maplibregl.NavigationControl());
</script>
</body>
</html>
